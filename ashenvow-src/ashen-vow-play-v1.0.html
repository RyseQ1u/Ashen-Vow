.combat-arena:before{opacity:.18;z-index:0;background:linear-gradient(90deg,#000b,transparent 27%,transparent 72%,#000b)}
.combat-arena:after{content:'';pointer-events:none;position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,transparent 28%,#0d0d153d 78%,#130e15b0)}
.combat-floor{z-index:0;height:36px;transform:none;opacity:.7;background:linear-gradient(180deg,#8563460f,#0b080a65)}
.crypt-moon{position:absolute;width:290px;height:290px;top:4px;left:calc(50% - 145px);border-radius:50%;background:radial-gradient(circle,#ddd0b021 0,#a69b8730 29%,#aab3ce0b 45%,transparent 70%);pointer-events:none;mix-blend-mode:screen;z-index:0}
.crypt-window,.crypt-column,.crypt-ruins{display:none} /* scenery is rendered in the bundled original SVG */
.combat-side{z-index:2}.combat-vs{z-index:2;text-shadow:0 0 25px #d8b880a6;color:#edd5b0;align-self:center;margin-top:13px}
.combat-unit{border-radius:7px 7px 0 0;outline:none;text-shadow:0 2px 7px #000e;cursor:help;overflow:visible;isolation:isolate;transition:filter .15s,transform .18s,background .15s;max-width:148px}
.combat-unit:focus-visible{outline:2px solid #fae0a5;outline-offset:1px}
.combat-unit .unit-art{filter:drop-shadow(2px 10px 8px #08090dd0)}
.combat-unit .figure-svg{animation:av-idle 4.5s ease-in-out infinite;transform-origin:50% 80%}
.combat-unit:nth-child(2) .figure-svg{animation-delay:-1.1s}
.combat-unit:nth-child(3) .figure-svg{animation-delay:-2.1s}
.combat-unit:nth-child(4) .figure-svg{animation-delay:-3.3s}
.combat-unit.unit-active .unit-art{filter:drop-shadow(0 0 10px #edc27d81) drop-shadow(1px 7px 6px #0d0e16)}
.combat-unit.unit-active:before{content:'';position:absolute;inset:1px 14px 48px;z-index:-1;background:radial-gradient(ellipse at 50% 75%,#d9ac6340 0,transparent 66%);pointer-events:none}
.combat-unit.unit-targetable{background:linear-gradient(180deg,#b78a4805,#a6754b35);box-shadow:inset 0 0 0 1px #cdad70a3;cursor:crosshair;border:1px solid #c49c69}
.combat-unit.unit-targetable .unit-art{filter:drop-shadow(0 0 16px #e8b67f8c)}
.combat-unit.unit-inspected:not(.unit-targetable){box-shadow:inset 0 0 0 1px #8fa3a495;background:#82959c1a}
.combat-unit .unit-position{position:relative;z-index:2;background:#090e15c9;border-color:#b49b7047;padding:4px 7px}
.combat-unit.dead{cursor:not-allowed}
.target-indicator{top:41px;z-index:5;font-weight:600;font-size:12px;letter-spacing:1px}
.unit-name{font-weight:600;font-size:13px;text-align:center;color:#f1e0c5}
.unit-numbers{font-size:11px}
.unit-meter{background:#0c0c11;border:1px solid #ad745777}
.unit-meter span{background:linear-gradient(90deg,#923e38,#e16c5b);box-shadow:0 0 7px #d0544566}
.unit-stress{height:5px;background:#211d1c;border:1px solid #d9b16339}
.unit-stress span{background:linear-gradient(90deg,#d3a34f,#ffcd73)}
.boss-arena{border-color:#9b5c4c;box-shadow:inset 0 0 92px #3f101047,0 15px 45px #000a}
.turn-strip{display:flex;align-items:center;gap:15px;margin:-5px 0 12px;font:11px Arial,'Microsoft YaHei',sans-serif;letter-spacing:1px;color:#afa196}
.turn-strip>span{flex-shrink:0;color:#c7ae8c}
.initiative-track{display:flex;flex:1;min-width:0;gap:7px;overflow:auto;scrollbar-width:thin;white-space:nowrap;padding:3px 0}
.initiative-pill{display:inline-flex;align-items:center;padding:6px 9px;border:1px solid #59493d;background:#201b20;color:#bba999;font-size:10px;border-radius:3px;white-space:nowrap}
.initiative-pill.friendly{border-color:#557d78a8;color:#aecbc0}
.initiative-pill.hostile{border-color:#9c564ba8;color:#ddb0a3}
.initiative-pill.currently{background:#7a5b333d;border-color:#eac384;box-shadow:0 0 10px #c2a06a34}
.combat-inspector{border:1px solid #605044;background:linear-gradient(110deg,#222127,#19191e);display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:12px 18px;min-height:84px;box-shadow:inset 0 1px #e0bb7722}
.combat-inspector>.eyebrow{font-size:10px;white-space:nowrap}
.unit-info-details{display:flex;align-items:center;gap:16px;min-width:0;flex:1;flex-wrap:wrap}
.unit-info-title{display:flex;flex-direction:column;gap:5px;min-width:85px;font-size:14px;color:#e4d3b9}
.unit-info-title small{font-size:10px;color:#a89789}
.unit-info-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#b4a596}
.unit-info-stats span{border-right:1px solid #574c41;padding-right:10px;white-space:nowrap}
.unit-info-stats b{color:#e0c59b;font-weight:normal}
.status-list{display:flex;gap:5px;flex-wrap:wrap}
.status-token{font-size:10px;white-space:nowrap;border:1px solid #96675e;background:#6b403c3d;color:#dec3b0;padding:4px 7px}
.status-token.status-guard{border-color:#a89169;color:#ead0a0}.status-token.status-none{border-color:#56514b;color:#897e74;background:transparent}
.inspector-tip{font-size:11px;color:#ab9783}
.skill-meta{color:#cfb17b!important;letter-spacing:0;margin-top:5px}
.skill:disabled{filter:grayscale(.5);opacity:.38}.skill.chosen{box-shadow:inset 0 0 0 1px #edd0a0,0 0 20px #dbac6340;transform:translateY(-2px)}
.skill:hover:not(:disabled){transform:translateY(-2px)}
.log-line{line-height:1.5}
.floating-damage{position:absolute;z-index:9;left:50%;top:17%;transform:translateX(-50%);pointer-events:none;font:bold 32px Georgia,serif;color:#ff7866;text-shadow:0 3px #231019,0 0 13px #fa4839;animation:av-float .85s cubic-bezier(.2,.75,.28,1) forwards}
.floating-damage.healing{color:#bcebbd;text-shadow:0 0 12px #70c798}
.floating-damage.critical{font-size:44px;color:#ffd28c;text-shadow:0 0 17px #ff9c62}
.floating-stress{font-size:16px;color:#f5c577;top:26%;white-space:nowrap}
.impact-hit .unit-art{animation:av-hit .25s ease both}.impact-heal .unit-art{filter:drop-shadow(0 0 19px #5ec398a3)!important}
.formation-controls{display:flex;justify-content:space-between;align-items:center;gap:4px;margin:11px 0;color:#b49d80;font:10px Arial,'Microsoft YaHei',sans-serif}
.formation-controls div{display:flex;gap:4px}.formation-controls .btn{min-height:24px;padding:4px 8px}
.gear-mini{display:flex;justify-content:space-between;color:#d3b991;margin:10px 0 8px;font-size:11px;gap:8px}
.hero-actions{flex-wrap:wrap}.hero-actions .btn{min-width:calc(50% - 4px);flex:1;line-height:1.35;font-size:10px}
.map-progress{display:flex;justify-content:space-between;gap:8px;margin:9px 2% 2px;font-size:11px;color:#84766c}
.map-progress span{padding:5px 7px;border-bottom:1px solid #51463d;min-width:50px;text-align:center}
.map-progress .cleared{color:#93b39f;border-color:#7d9f87}
.map-progress .current{color:#f0cd92;border-color:#e8b969;box-shadow:0 3px 4px #b89b4133}
.map-node:not(.available):not(.explored){opacity:.43}

@keyframes av-hit{0%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-2deg)}55%{transform:translateX(8px) rotate(3deg)}100%{transform:translateX(0)}}
@keyframes av-float{0%{opacity:0;transform:translate(-50%,12px) scale(.78)}20%{opacity:1;transform:translate(-50%,-7px) scale(1.18)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-72px) scale(1)}}

@media(max-width:650px){.combat-arena{height:292px;min-height:292px}.combat-inspector{padding:10px}.unit-info-stats{font-size:10px}.turn-strip{flex-direction:column;gap:3px;align-items:stretch}.combat-unit .unit-art{height:130px}.combat-unit .figure-svg{height:100%}.unit-name{font-size:10px}.combat-unit .unit-position{font-size:8px}.floating-damage{font-size:23px}.map-progress{font-size:9px}.map-progress span{min-width:0;padding:4px 2px}.hero-actions .btn{font-size:9px}}

/* V0.3 / recruiting, roster and trinket management */
.camp-tabs{display:flex;gap:8px;padding:14px 0 22px;flex-wrap:wrap;border-bottom:1px solid #564b3b;margin-bottom:21px}
.camp-tab{font:600 12px Arial,'Microsoft YaHei',sans-serif;cursor:pointer;min-width:140px;color:#aa9b87;background:linear-gradient(155deg,#252125,#16171a);padding:12px 18px;letter-spacing:1px;border:1px solid #55483e;transition:background .15s,border-color .15s}
.camp-tab:hover{border-color:#b99d6a;color:#ead3b0}

.roster-page,.trinkets-page{min-width:0;background:linear-gradient(160deg,#201e21,#191a1f);border:1px solid #4c423b;padding:25px;box-shadow:inset 0 1px #a18c5c20}

/* V0.6 — traits, difficulty and technique upgrades */
.trait-summary{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 4px}
.trait-tag{font-size:10px;padding:4px 7px;border:1px solid #526454;border-radius:4px;background:#17241b;color:#b5d3a2;white-space:nowrap}
.trait-tag.negative{border-color:#694c53;background:#281c23;color:#dba3a1}
.difficulty-picker{margin-top:20px;padding:14px 0;border-top:1px solid #5c5148}
.difficulty-options{display:grid;gap:7px;margin-top:8px}
.difficulty-option{border:1px solid #514a42;background:#191b1d;color:#d9d0bf;text-align:left;padding:11px 12px;display:grid;gap:4px;border-radius:4px;cursor:pointer}
.difficulty-option.selected{border-color:#d6b885;background:#2d281f;box-shadow:inset 0 0 0 1px #937751}
.difficulty-option b{font-size:13px}.difficulty-option small{font-size:11px;color:#9c9c98;line-height:1.35}.difficulty-option em{font-size:10px;color:#c7a66f;font-style:normal}
.skill-training-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:14px}
.training-card{padding:18px;border:1px solid #534c43;border-radius:5px;background:linear-gradient(150deg,#222326,#18191c);display:flex;flex-direction:column;gap:8px;min-height:252px}
.training-icon{font-size:28px;color:#d9b57b}.training-card h4{font-size:18px;margin:0;color:#eee4d2}.training-card p{color:#acaa9f;font-size:12px;line-height:1.55;flex:1}
.training-meter{display:flex;gap:6px;margin-bottom:5px}.training-meter span{height:7px;background:#494139;border-radius:8px;flex:1}.training-meter .filled{background:#d6b885}

.camp-team-face svg{width:100%;height:100%}
.camp-team-meta{flex:1;min-width:0}
.camp-team-meta b{display:block;color:#e4cba8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp-team-meta small{display:block;color:#9f968b;font-size:10px;margin:2px 0 5px}
.camp-team-nums{font-size:10px;color:#84766c;margin-top:4px}
.camp-reserve-strip{border:1px solid #514638;background:#17191ccc;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.camp-reserve-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.camp-reserve-chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;border:1px solid #55483e;background:#1b1c22;padding:5px;cursor:pointer;color:#c9b79c;font-size:10px}
.camp-reserve-chip svg{width:40px;height:40px}
.camp-reserve-chip.empty{height:64px;justify-content:center;font-size:22px;color:#8e744f;border-style:dashed}
.camp-depart-bar{display:flex;align-items:center;justify-content:space-between;gap:18px;border:1px solid #8e704f;background:linear-gradient(100deg,#3b2c22,#1c1a1f);padding:16px 22px}
.camp-depart-info span{color:#f3dfbf;font-size:18px;display:block}
.camp-depart-info small{color:#b3a495;font-size:12px}
.btn.camp-depart{min-width:200px;min-height:56px;font-size:20px;letter-spacing:4px}
@media(max-width:1040px){.camp-layout{grid-template-columns:1fr}.camp-side-nav{flex-direction:row;position:static}.camp-side-item{flex:1;padding:10px 6px}.camp-team-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.camp-buildings{grid-template-columns:1fr}.camp-quick-actions{flex-wrap:wrap}.btn.camp-quick{min-width:calc(50% - 5px)}.camp-depart-bar{flex-direction:column;align-items:stretch}.btn.camp-depart{width:100%}.camp-team-row{grid-template-columns:1fr}}

/* Phase 3 — map node intel + team strip */
.map-node.selected .node-outer{stroke:#e8c88c;stroke-width:3;filter:drop-shadow(0 0 8px #e8c88c88)}
.map-node.selected .node-inner{fill:#4a3b2a}
.map-node.available{cursor:pointer}
.map-detail{border:1px solid #6d583f;background:linear-gradient(150deg,#242127,#191a1f);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.map-detail.empty{border-style:dashed;opacity:.85}
.map-detail-name{color:#f0ddc0;font-size:18px;margin:2px 0 0}
.map-detail-type{color:#c5a472;font-size:12px;letter-spacing:1px}
.map-detail-row{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#b4a596}
.map-detail-row>span{color:#8f8478;letter-spacing:1px;font-size:11px}
.map-detail-row ul{margin:0;padding-left:16px;color:#d6c2a4;line-height:1.6}
.map-detail-row strong{font-size:14px}
.risk-skulls{color:#c9564a;font-size:16px;letter-spacing:2px}
.risk-skulls i{font-style:normal;color:#4a4340}
.ok-text{color:#8fbf9a}
.danger-text{color:#d47a6a}
.map-team-strip{border:1px solid #5b4a3c;background:#17191ccc;padding:14px 16px;margin-top:16px}
.map-strip-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.map-strip-head b{color:#e9d6b8}
.map-strip-note{font-size:11px;color:#84766c}
.map-strip-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.map-strip-card{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid #514638;background:#1b1c22;padding:10px;min-width:0}
.map-strip-face{width:52px;height:60px;overflow:hidden;flex-shrink:0;background:radial-gradient(ellipse at 50% 80%,color-mix(in srgb,var(--accent),transparent 75%),transparent 70%),#2a2430;border:1px solid #5b4d3b}
.map-strip-face svg{width:100%;height:100%}
.map-strip-meta{flex:1;min-width:0}
.map-strip-meta b{display:block;color:#e4cba8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-strip-meta small{display:block;color:#9f968b;font-size:10px;margin:2px 0 5px}
.map-strip-nums{font-size:10px;color:#84766c;margin-top:4px}
.map-strip-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
@media(max-width:1040px){.map-strip-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.map-strip-row{grid-template-columns:1fr}}

/* Phase 4 — main menu shell */
.landing-shell{position:relative;z-index:1;width:min(1120px,100%);margin:0 auto;padding:28px 24px 30px;min-height:calc(100vh - 137px);display:flex;flex-direction:column}
.landing-top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.landing-brand{text-shadow:0 2px 12px #09080b}
.landing-profile{display:flex;align-items:center;gap:12px;border:1px solid #6d583f;background:linear-gradient(120deg,#2a2229cc,#17181ccc);padding:10px 16px 10px 10px;backdrop-filter:blur(4px)}
.profile-orb{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid #c9a76e;background:radial-gradient(circle at 35% 30%,#e8c18a,#7a5b33);color:#241a12;font-weight:bold;font-size:18px;box-shadow:0 0 14px #c2a06a4d}
.profile-copy b{display:block;color:#f0ddc0;font-size:15px;letter-spacing:1px}
.profile-copy small{display:block;color:#b3a495;font-size:11px;margin-top:2px}
.landing-inner{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 0 12px}
.landing-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:34px auto 22px;width:min(920px,100%)}
.landing-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:128px;text-align:left;border:1px solid #5c4c3e;background:linear-gradient(155deg,#2b242cd9,#181a1fd9);color:#e2d0b4;padding:18px 18px 16px;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}
.landing-card:hover{transform:translateY(-3px);border-color:#c9a76e;box-shadow:0 12px 28px #c29a5236}
.landing-card.primary{border-color:#c9a76e;background:linear-gradient(155deg,#4a3626e8,#221c20e8);box-shadow:inset 0 1px #e4c38e4a}
.landing-card.primary:hover{box-shadow:inset 0 1px #e4c38e4a,0 14px 32px #c29a525c}
.landing-card-icon{font-size:22px;color:#e8c18a;line-height:1}
.landing-card b{font-size:16px;color:#f0ddc0;letter-spacing:1px}
.landing-card small{font-size:11px;color:#a99b8c;line-height:1.55}
.landing-save-card{position:relative;align-self:flex-start;display:flex;flex-direction:column;gap:6px;min-width:240px;max-width:300px;border:1px solid #6d583f;background:linear-gradient(140deg,#2a2229e8,#17181ce8);padding:14px 16px;backdrop-filter:blur(4px)}
.save-card-tag{font:600 10px Arial,sans-serif;letter-spacing:2px;color:#c5a472}
.landing-save-card b{color:#f0ddc0;font-size:15px}
.landing-save-card p{margin:0;font-size:11px;color:#b3a495}
.landing-save-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.landing-foot{margin-top:22px;display:flex;justify-content:space-between;gap:12px;font:10px Arial,sans-serif;letter-spacing:1.7px;color:#b2a397a6}
@media(max-width:1040px){.landing-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.landing-cards{grid-template-columns:1fr}.landing-save-card{max-width:none;width:100%}.landing-foot{flex-direction:column;align-items:flex-start}.landing-profile{width:100%}}

function skillBranch(hero,skillId){return SKILL_BRANCHES[skillId]?.find(b=>b.id===hero?.skillBranches?.[skillId])||null;}
function chooseSkillBranch(state,heroId,skillId,branchId){
 if(state.phase!=='camp')return false;ensureProgression(state);
 const hero=[...state.heroes,...state.reserveHeroes].find(h=>h.id===heroId);
 if(!hero||!CLASSES[hero.classId].skills.includes(skillId)||skillLevel(hero,skillId)<1)return false;
 const branch=SKILL_BRANCHES[skillId]?.find(b=>b.id===branchId);
 if(!branch||hero.skillBranches[skillId]===branchId)return false;
 const switching=Boolean(hero.skillBranches[skillId]);const cost=switching?{gold:22,shards:2}:BRANCH_TRAINING_COST;
 if(state.gold<cost.gold||state.shards<cost.shards)return false;
 state.gold-=cost.gold;state.shards-=cost.shards;hero.skillBranches[skillId]=branchId;
 state.history.unshift(`${hero.name} 选择了「${SKILLS[skillId].name}」分支：${branch.name}。`);return true;
}
function activeTrinketSet(hero,state){
 if(!state?.items)return null;
 const bases=(hero.trinkets||[]).map(id=>state.items.find(i=>i.id===id)?.baseId).filter(Boolean);
 return Object.entries(TRINKET_SETS).find(([,set])=>set.pieces.every(base=>bases.includes(base)))?.[0]||null;
}
function enemyResistances(type){
 const isUndead=['thrall','ghoul','guardian','wraith','bonearcher','banshee','boss'].includes(type);
 const isMire=['mireling','sporewitch','bogstalker','leech','bogcolossus','mirequeen'].includes(type);
 const isForge=['emberguard','slagbeast','cinderseer','smelter','ironreaver','forgeheart'].includes(type);
 const base={poison:10,bleed:10,stun:15,weak:5};
 if(isUndead){base.poison=55;base.bleed=0;}
 if(isMire){base.poison=65;base.bleed=5;}
 if(isForge){base.poison=0;base.bleed=40;base.stun=30;}
 if(BOSS_TYPES.includes(type)){base.stun=85;base.weak=30;}
 return base;
}
function heroResistances(hero){return {poison:Math.min(60,8+Math.max(0,hero.armor||0)*3),bleed:Math.min(65,10+Math.max(0,hero.armor||0)*5),stun:10,weak:10};}
function inflictStatus(state,target,status,chance=100,duration=2){
 if(!STATUS_LABELS[status]||target.hp<=0)return false;
 const resist=target.side==='enemy'?enemyResistances(target.type):heroResistances(target);
 const actual=clamp(chance-(resist[status]||0),0,100);
 if(integer(state,1,100)>actual){log(state.battle,`${target.name} 抵抗了${STATUS_LABELS[status]}（抗性 ${resist[status]||0}%）`,'system');return false;}
 target.statuses[status]=Math.max(target.statuses[status]||0,duration);
 log(state.battle,`${target.name} 受到${STATUS_LABELS[status]}影响`,'hurt');return true;
}
function quirkTreatmentCost(state){return {gold:Math.max(16,38-buildingLevel(state,'chapel')*5),shards:2};}
function treatNegativeTrait(state,heroId,traitId){
 if(state.phase!=='camp'||TRAITS[traitId]?.kind!=='negative')return false;ensureProgression(state);
 const hero=[...state.heroes,...state.reserveHeroes].find(h=>h.id===heroId),cost=quirkTreatmentCost(state);
 if(!hero?.traits.includes(traitId)||state.gold<cost.gold||state.shards<cost.shards)return false;
 state.gold-=cost.gold;state.shards-=cost.shards;hero.traits=hero.traits.filter(x=>x!==traitId);
 hero.maxHp=heroStats(hero,state).maxHp;hero.hp=Math.min(hero.hp,hero.maxHp);
 state.history.unshift(`${hero.name} 治愈了负面特质「${TRAITS[traitId].name}」。`);return true;
}
function evolveTrait(state,hero,reason){
 // Only active heroes have a chance to change after an expedition. Use save-seeded RNG.
 const kind=reason==='victory'?'positive':'negative';
 const chance=reason==='victory'?23:reason==='retreat'?18:45;
 if(integer(state,1,100)>chance)return null;
 const possible=Object.keys(TRAITS).filter(id=>TRAITS[id].kind===kind&&!hero.traits.includes(id));
 if(!possible.length)return null;
 // Three-trait cap controls runaway stat inflation.
 if(hero.traits.length>=3){const removed=hero.traits.find(id=>TRAITS[id].kind===kind);
  if(!removed)return null;hero.traits=hero.traits.filter(id=>id!==removed);}
 const chosen=possible[integer(state,0,possible.length-1)];hero.traits.push(chosen);
 hero.maxHp=heroStats(hero,state).maxHp;hero.hp=Math.min(hero.hp,hero.maxHp);
 state.history.unshift(`${hero.name} ${kind==='positive'?'获得':'染上'}特质「${TRAITS[chosen].name}」。`);return chosen;
}

function enemyIntent(unit,battle){
 if(!unit||unit.side!=='enemy'||unit.hp<=0)return null;
 const type=unit.type;
 if(['boss','mirequeen','forgeheart'].includes(type)&&battle?.round%3===0)return {title:'群体威胁',detail:'预计下一次行动造成全队伤害与压力',level:'critical'};
 if(['cultist','wraith','banshee','herald'].includes(type))return {title:'精神侵蚀',detail:'倾向攻击后排或治疗者，提升压力',level:'warning'};
 if(['sporewitch','mirequeen','mireling','leech','alchemist'].includes(type))return {title:'毒素侵袭',detail:'可能施加中毒，优先保护脆弱角色',level:'warning'};
 if(['butcher'].includes(type))return {title:'撕裂重击',detail:'对前排造成高伤害，可能施加流血',level:'critical'};
 if(['bogcolossus','ironreaver','slagbeast'].includes(type))return {title:'前排重压',detail:'预计向前排发动强力物理攻击',level:'critical'};
 if(['bonearcher','cinderseer','smelter'].includes(type))return {title:'远程压制',detail:'可能袭击后排及低生命目标',level:'warning'};
 return {title:'近战攻击',detail:'倾向攻击前排，实际目标可能变化',level:'normal'};
}
function expeditionSummary(state){
 const reports=Array.isArray(state.expeditionReports)?state.expeditionReports:[];
 return {total:reports.length,victories:reports.filter(r=>r.reason==='victory').length,
  gold:reports.reduce((n,r)=>n+(r.gold||0),0),shards:reports.reduce((n,r)=>n+(r.shards||0),0),
  averageGold:reports.length?Math.round(reports.reduce((n,r)=>n+(r.gold||0),0)/reports.length):0,
  reports:reports.slice(0,10)};
}

function skillLevel(hero,skillId){return Math.max(0,Math.min(MAX_SKILL_LEVEL,hero?.skillLevels?.[skillId]||0));}
function skillTrainingCost(hero,skillId){const lv=skillLevel(hero,skillId);return {gold:24+lv*20,shards:2+lv*2};}
function trainSkill(state,heroId,skillId){if(state.phase!=='camp')return false;ensureProgression(state);
 const hero=[...state.heroes,...state.reserveHeroes].find(h=>h.id===heroId);
 if(!hero||!CLASSES[hero.classId].skills.includes(skillId)||skillLevel(hero,skillId)>=MAX_SKILL_LEVEL)return false;
 const cost=skillTrainingCost(hero,skillId);if(state.gold<cost.gold||state.shards<cost.shards)return false;
 state.gold-=cost.gold;state.shards-=cost.shards;hero.skillLevels[skillId]++;
 state.history.unshift(`${hero.name} 训练了「${SKILLS[skillId].name}」至 ${hero.skillLevels[skillId]} 级。`);return true;}
function selectDifficulty(state,id){if(state.phase!=='camp'||!DIFFICULTIES[id])return false;ensureProgression(state);state.selectedDifficulty=id;return true;}
function defaultTraits(hero){const ids=Object.keys(TRAITS);const positives=ids.filter(x=>TRAITS[x].kind==='positive'),negatives=ids.filter(x=>TRAITS[x].kind==='negative');
 let code=0;for(const ch of String(hero.id||hero.name||'a'))code=(code*31+ch.charCodeAt(0))>>>0;
 return [positives[code%positives.length],negatives[Math.floor(code/7)%negatives.length]];}
function assignHeroGrowth(hero){if(!Array.isArray(hero.traits)||hero.traits.some(id=>!TRAITS[id]))hero.traits=defaultTraits(hero);
 if(!hero.skillLevels||typeof hero.skillLevels!=='object')hero.skillLevels={};
 if(!hero.skillBranches||typeof hero.skillBranches!=='object')hero.skillBranches={};
 for(const [id,choice] of Object.entries(hero.skillBranches))if(!CLASSES[hero.classId].skills.includes(id)||!SKILL_BRANCHES[id]?.some(b=>b.id===choice)||hero.skillLevels[id]<1)delete hero.skillBranches[id];
 for(const id of CLASSES[hero.classId].skills)if(!Number.isInteger(hero.skillLevels[id])||hero.skillLevels[id]<0||hero.skillLevels[id]>MAX_SKILL_LEVEL)hero.skillLevels[id]=0;
 if(!CRISES[hero.crisis])hero.crisis=null;
 if(hero.afflicted&&hero.stress>=100&&!hero.crisis){let sum=0;for(const c of String(hero.id))sum+=c.charCodeAt(0);hero.crisis=Object.keys(CRISES)[sum%Object.keys(CRISES).length];}
 if(hero.stress<65){hero.afflicted=false;hero.crisis=null;}
 return hero;}

function regionOf(state){const id=state?.expedition?.region||state?.selectedRegion||'crypt';return REGIONS[id]?id:'crypt';}
function selectRegion(state,id){if(state.phase!=='camp'||!REGIONS[id])return false;ensureProgression(state);state.selectedRegion=id;return true;}

// V0.4 settlement progression: additive data, compatible with schemaVersion 1 saves.
function buildingLevel(state,id){return Math.max(0,Math.min(MAX_BUILDING_LEVEL,Number(state.buildings?.[id]||0)));}
function buildingCost(state,id){const def=BUILDINGS[id];if(!def)return null;const lv=buildingLevel(state,id);
 return {gold:def.gold+30*lv,shards:def.shards+3*lv};}
function upgradeBuilding(state,id){if(state.phase!=='camp'||!BUILDINGS[id])return false;ensureProgression(state);
 const lv=buildingLevel(state,id),cost=buildingCost(state,id);
 if(lv>=MAX_BUILDING_LEVEL||state.gold<cost.gold||state.shards<cost.shards)return false;
 state.gold-=cost.gold;state.shards-=cost.shards;state.buildings[id]=lv+1;
 state.history.unshift(`${BUILDINGS[id].name} 已升到 ${lv+1} 级。`);return true;}
function campHealCost(state){return Math.max(12,20-buildingLevel(state,'infirmary')*2);}
function campPrayerCost(state){return Math.max(9,17-buildingLevel(state,'chapel')*2);}
function prayAtCamp(state,id){if(state.phase!=='camp')return false;ensureProgression(state);
 const h=[...state.heroes,...state.reserveHeroes].find(x=>x.id===id),cost=campPrayerCost(state);
 if(!h||h.stress<=0||state.gold<cost)return false;
 state.gold-=cost;addStress(h,-(24+buildingLevel(state,'chapel')*10));
 state.history.unshift(`${h.name} 在礼拜堂静心祷告。`);return true;}
function selectExpeditionPlan(state,id){if(state.phase!=='camp'||!EXPEDITION_PLANS[id])return false;ensureProgression(state);
 state.expeditionPlan=id;return true;}
function allocateTalent(state,id,talentId){if(state.phase!=='camp'||!TALENTS[talentId])return false;ensureProgression(state);
 const h=[...state.heroes,...state.reserveHeroes].find(x=>x.id===id);
 if(!h||h.talentPoints<=0||(h.talents[talentId]||0)>=TALENTS[talentId].max)return false;
 h.talentPoints--;h.talents[talentId]=(h.talents[talentId]||0)+1;
 h.maxHp=heroStats(h,state).maxHp;h.hp=Math.min(h.hp,h.maxHp);
 state.history.unshift(`${h.name} 掌握了${TALENTS[talentId].name}（${h.talents[talentId]}级）。`);return true;}

// Data-driven trinkets: item instance -> base + 1-2 affixes, equipped in two unique slots.
function trinketMods(item){const mods={};if(!item)return mods;
 const sources=[TRINKET_BASES[item.baseId],...(item.affixes||[]).map(id=>AFFIXES[id])];
 for(const source of sources)for(const [key,value] of Object.entries(source?.mods||{}))mods[key]=(mods[key]||0)+value;

}
function trinketName(item){const base=TRINKET_BASES[item?.baseId];return `${(item?.affixes||[]).map(id=>AFFIXES[id]?.name).filter(Boolean).join('·')}${base?.name||'未知饰品'}`;}
function ownedTrinketIds(state){return new Set([...state.heroes,...(state.reserveHeroes||[])].flatMap(h=>h.trinkets||[]).filter(Boolean));}
function makeTrinket(state,rarity){const bases=Object.keys(TRINKET_BASES),affixes=Object.keys(AFFIXES);const roll=rarity||(['common','common','common','rare','rare','epic'][integer(state,0,5)]);
 const slots=roll==='epic'?3:roll==='rare'?2:1;const selected=[];
 while(selected.length<slots){const affix=affixes[integer(state,0,affixes.length-1)];if(!selected.includes(affix))selected.push(affix);}
 const id=state.nextItemId??1;state.nextItemId=id+1;
 return {id:`trinket-${id}`,baseId:bases[integer(state,0,bases.length-1)],affixes:selected,rarity:roll};
}
function awardTrinket(state,rarity){if(!state.expedition)return null;state.expedition.lootItems??=[];
 const item=makeTrinket(state,rarity);state.expedition.lootItems.push(item);state.history.unshift(`找到饰品：${trinketName(item)}`);return item;
}
function recruitOffers(state){const classes=Object.keys(CLASSES);return Array.from({length:3},()=>({classId:classes[integer(state,0,classes.length-1)],name:RECRUIT_NAMES[integer(state,0,RECRUIT_NAMES.length-1)]}));}
function ensureProgression(state){if(!Array.isArray(state.reserveHeroes))state.reserveHeroes=[];if(!Array.isArray(state.items))state.items=[];
 if(typeof state.tutorialSeen!=='boolean')state.tutorialSeen=true; // legacy players have already learned the basics

 if(!Array.isArray(state.expeditionReports))state.expeditionReports=[];

function battleTelemetry(before,after){

  const old=byId.get(unit.id);
  if(!old){effects.push({id:unit.id,kind:'summon',value:0});continue;}
  const amount=(old.hp??0)-(unit.hp??0);
  if(amount>0)effects.push({id:unit.id,kind:unit.hp<=0?'death':'damage',value:amount});
  if(amount<0)effects.push({id:unit.id,kind:'heal',value:-amount});
  const stress=(unit.stress??0)-(old.stress??0);
  if(stress>0)effects.push({id:unit.id,kind:'stress',value:stress});
  if(stress<0)effects.push({id:unit.id,kind:'calm',value:-stress});
  for(const key of ['poison','bleed','stun','mark','weak','guard']){
   if((unit.statuses?.[key]||0)>(old.statuses?.[key]||0))effects.push({id:unit.id,kind:'status',status:key,value:unit.statuses[key]});
  }

  victory:after.finished===true};
}

function mapPage(){const ex=game.expedition;const region=REGIONS[ex.region]||REGIONS.crypt;const possible=reachableNodes(game).map(n=>n.id);const pos=n=>({x:90+n.layer*174,y:195+n.row*103});let edges='';

function battleSkillCard(id,index,actor,b,chosen){
 const s=SKILLS[id],lv=skillLevel(actor,id),branch=skillBranch(actor,id);
 const enabled=s.caster.includes(actor.rank),valid=enabled?validTargets(b,actor,s):[];
 const disabled=!enabled||valid.length===0;
 const cat=s.category||'damage';
 const catLabel=SKILL_CATEGORY_LABELS?.[cat]||'';
 return `<button class="skill-card cat-${cat} ${chosen===id?'chosen':''}" data-action="skill" data-id="${id}" ${disabled?'disabled':''} title="${ESC(s.desc)}">
  <span class="skill-card-tag">${catLabel}</span>
  <span class="skill-card-art">${s.icon}</span>
  <span class="skill-card-body"><b>${index}. ${ESC(s.name)}${lv?` +${lv}`:''}</b>
   <small>${ESC(s.desc)}</small>
   ${branch?`<em>${ESC(branch.name)}</em>`:''}
   <span class="skill-card-meta">命中 ${s.accuracy}% · 站位 ${s.caster.join('/')}</span>
  </span>
  <span class="skill-card-pips">${[1,2,3].map(n=>`<i class="${n<=(lv||0)?'filled':''}"></i>`).join('')}</span>
 </button>`;
}
function battleBasicCard(actor,chosen){
 const disabled=false;
 return `<button class="skill-card cat-attack ${chosen==='__basic__'?'chosen':''}" data-action="basic-attack" title="以 100% 攻击力进行普通攻击，无站位限制">
  <span class="skill-card-tag">攻击</span>
  <span class="skill-card-art">⚔</span>
  <span class="skill-card-body"><b>普攻</b><small>100% 攻击力 · 无站位限制</small>
   <span class="skill-card-meta">命中 92%</span></span>
  <span class="skill-card-pips"><i class="filled"></i><i class="filled"></i><i class="filled"></i></span>
 </button>`;
}
function battleHeroPanel(actor){
 if(!actor||actor.side!=='hero')return '';
 const heroRef=game.heroes.find(h=>h.id===actor.id)||actor;
 const stats=heroStats(heroRef,game);
 const xp=heroRef.xp??Math.min(99,((actor.level||1)-1)*22+8);
 return `<div class="battle-hero-panel">
  <div class="battle-hero-face">${svgPortrait(actor.classId,false,true)}</div>
  <div class="battle-hero-meta">
   <div class="battle-hero-name">${ESC(actor.name)}</div>
   <div class="battle-hero-sub">${ESC(CLASSES[actor.classId]?.name||'')} · Lv.${actor.level||1}</div>
   <div class="battle-hero-bars">
    <div class="bar hp"><span style="width:${percent(actor.hp,actor.maxHp)}%"></span></div>
    <div class="bar xp"><span style="width:${clamp(xp,0,100)}%"></span></div>
   </div>
   <div class="battle-hero-nums"><b>HP ${Math.round(actor.hp)}/${actor.maxHp}</b><span>经验 ${xp}/100</span></div>
   <div class="battle-hero-stats">
    <span>攻击 <b>${actor.attack}</b></span>
    <span>防御 <b>${actor.armor}</b></span>
    <span>暴击 <b>${10+(stats.critBonus||0)}%</b></span>
    <span>速度 <b>${actor.speed}</b></span>
   </div>
  </div>
  <button class="btn btn-tiny btn-ghost battle-hero-detail" data-action="unit" data-id="${actor.id}">详情</button>
 </div>`;
}
function battlePage(){
 const b=game.battle,actor=currentActor(game),region=REGIONS[b.region]||REGIONS.crypt;
 if(!b)return '<div>战斗恢复中...</div>';
 const hero=actor?.side==='hero',skillList=hero?CLASSES[actor.classId].skills:[];
 const chosen=chosenSkill==='__basic__'?'__basic__':(chosenSkill&&skillList.includes(chosenSkill)?chosenSkill:null);

 const queue=b.order.slice(Math.max(0,b.turnIndex-1)).filter(id=>units.some(u=>u.id===id&&u.hp>0)).slice(0,10).map(id=>{
  const u=units.find(x=>x.id===id);if(!u)return '';

   ${b.enemies.filter(e=>e.hp>0).slice(0,4).map(e=>{const i=enemyIntent(e,b);return `<div class="intent-chip ${i.level}" title="${ESC(i.detail)}"><strong>${ESC(e.name)}</strong><span>${ESC(i.title)}</span></div>`}).join('')}</div>
  <div class="combat-arena region-${b.region||'crypt'} ${b.kind==='boss'?'boss-arena':''}">

   <div class="combat-side heroes">${[...b.heroes].sort((a,c)=>c.rank-a.rank).map(u=>unitCard(u,'hero')).join('')}</div>
   <div class="combat-vs"><span>⚔</span></div>
   <div class="combat-side enemies">${[...b.enemies].sort((a,c)=>a.rank-c.rank).map(u=>unitCard(u,'enemy')).join('')}</div>
  </div>
  <div class="combat-action-report">${ESC(b.logs[0]?.text||'警惕阴影中的动静……')}</div>
  <div class="combat-inspector"><span class="eyebrow">${(chosen||basicMode)?'SELECT TARGET · 目标选择':'UNIT INSPECTOR · 单位情报'}</span>

   <span class="inspector-tip">${basicMode?'普攻：点击敌方目标发动普通攻击':chosen?`释放「${SKILLS[chosen].name}」：${SKILLS[chosen].side==='ally'?'选择队友':'选择敌人'}`:'点击任一角色查看属性与异常状态'}</span></div>
  <div class="combat-dashboard">

    <div class="combat-skills panel">
     <div class="eyebrow">${hero?`${ESC(actor.name)} · 技能卡`:'行动进行中'}</div>
     <div class="skill-card-grid">
      ${hero?skillList.map((id,i)=>battleSkillCard(id,i+1,actor,b,chosen)).join('')+battleBasicCard(actor,chosen):'<div class="muted">敌人行动已自动执行，请等待下一位英雄。</div>'}
     </div>
     <div class="battle-main-actions">
      ${hero?`<button class="btn btn-gold" data-action="basic-attack" ${basicMode?'disabled':''}>攻击</button>

function eventPage(){const event=game.event,region=regionOf(game),presentation=eventPresentation(event,region);
 return `<section class="content-view event-view region-${presentation.region} event-${presentation.motif}"><div class="event-chamber"><div class="event-scene" aria-hidden="true"><span class="event-horizon"></span><span class="event-silhouette"></span><span class="event-light"></span></div><div class="event-sigil"><div class="event-sigil-inner">${presentation.glyph}</div></div><div class="eyebrow overline">${ESC(event.eyebrow)} · ${presentation.kicker}</div><h1>${ESC(event.title)}</h1><div class="ornament">✦ ─── ❖ ─── ✦</div><p class="event-story">${ESC(event.desc)}</p><div class="event-choice-heading">请选择行动 <span>CHOICES HAVE CONSEQUENCES</span></div><div class="event-choices">${event.choices.map((choice,i)=>`<button class="choice" data-action="choice" data-id="${ESC(choice.kind)}"><span class="choice-index">0${i+1}</span><span><b>${ESC(choice.label)}</b><small>${ESC(choice.hint)}</small></span><span class="choice-arrow">→</span></button>`).join('')}</div></div></section>`;
}
function resultPage(){const r=game.result,win=r.reason==='victory',region=REGIONS[r.region]||REGIONS.crypt;return `<section class="content-view result-view region-${r.region||'crypt'}"><div class="result-mark">${win?'✦':r.reason==='retreat'?'◇':'☽'}</div><div class="eyebrow overline">${region.name} · ${DIFFICULTIES[r.difficulty||'pilgrim']?.name||'巡礼'} · EXPEDITION REPORT</div><h1>${win?'黎明尚未消亡':r.reason==='retreat'?'从深渊归来':'黑暗夺走一切'}</h1><p class="result-sub">${win?'代价沉重，但你们守住了誓约。':r.reason==='retreat'?'逃离不代表怯懦。仍然活着，就是机会。':'火焰熄灭了，但营地仍在等待。'}</p><div class="result-grid"><div><small>探索房间</small><strong>${r.rooms}</strong></div><div><small>收获金币</small><strong>◈ ${r.rewards.gold}</strong></div><div><small>遗物碎片</small><strong>✥ ${r.rewards.shards}</strong></div><div><small>饰品战利品</small><strong>✧ ${r.rewards.items?.length||0}</strong></div></div>${button('返回残火营地 <span>→</span>','camp','','btn btn-gold btn-xl')}</section>`;}
function savesPage(){return `<section class="content-view utility-view"><div class="utility-heading">${label('命运的残页','SAVE ARCHIVES')}<p>所有进度仅存储在当前浏览器。建议定期导出 JSON 备份。</p></div><div class="saves-grid">${Array.from({length:SLOT_COUNT},(_,i)=>{const num=i+1,rec=slotRecord(num),saved=rec&&snapshotValid(rec)&&isValidSave(rec.data)?rec.data:null;return `<article class="save-card"><div class="save-index">ARCHIVE <strong>0${num}</strong></div><div class="save-emblem">${saved?'✥':'◇'}</div><h3>${saved?'残火营地 · 第 '+(saved.day||1)+' 日':rec?'存档需要恢复':'空白存档'}</h3><p>${saved?`远征 ${saved.expeditions||0} 次 · ${stamp(rec.updatedAt)}`:rec?'存档异常，请恢复备份':'尚未记录任何誓约'}</p><div class="save-actions">${saved?`${button('继续游戏','load',`data-slot="${num}"`,'btn btn-gold btn-full')}${button('导出备份','export',`data-slot="${num}"`,'btn btn-ghost btn-full')}${button('覆盖新建','new',`data-slot="${num}"`,'btn btn-ghost btn-full')}${button('删除存档','delete',`data-slot="${num}"`,'btn btn-danger btn-full')}`:button('创建新游戏','new',`data-slot="${num}"`,'btn btn-gold btn-full')}${button('从 JSON 导入','import',`data-slot="${num}"`,'btn btn-ghost btn-full')}${!saved&&rec?button('删除损坏存档','delete',`data-slot="${num}"`,'btn btn-danger btn-full'):''}${(cachedBackups[num]||[]).map(b=>button(`恢复备份 ${b.age} · 第${b.day||'?'}日${b.valid?'':'（损坏）'}`,'restore',`data-slot="${num}" data-age="${b.age}" ${b.valid?'':'disabled'}`,'btn btn-ghost btn-full')).join('')}</div></article>`}).join('')}</div><div class="warning-box"><strong>重要存档提示</strong><p>隐私模式、浏览器清理网站数据、切换浏览器或域名会导致进度不可访问。导出 JSON 文件可以离线备份；导入时会校验格式，并在覆盖前确认。</p></div></section>`;}
function settingsPage(){return `<section class="content-view utility-view"><div class="utility-heading">${label('旅人手记','SETTINGS')}<p>全部设置仅保存在当前浏览器，游戏不需要账号、联网或后端服务。</p></div><div class="settings-panel panel">
 <div class="setting-row"><div><h3>界面音效</h3><p>启用或静音合成音效</p></div><button class="switch ${settings.sound?'on':''}" data-action="setting-sound" aria-label="切换音效"><span></span></button></div>
 <div class="setting-row"><div><h3>环境音乐</h3><p>营地与旅途的低吟氛围音（合成生成，离线可用）</p></div><button class="switch ${settings.music?'on':''}" data-action="setting-music" aria-label="切换环境音乐"><span></span></button></div>
 <div class="setting-row"><div><h3>减少动态效果</h3><p>关闭多数装饰性过渡和动画</p></div><button class="switch ${settings.lowMotion?'on':''}" data-action="setting-motion" aria-label="切换减少动效"><span></span></button></div>
 <div class="setting-row"><div><h3>大字体模式</h3><p>扩大文字，方便在较小屏幕阅读</p></div><button class="switch ${settings.largeText?'on':''}" data-action="setting-text" aria-label="切换大字体"><span></span></button></div>
 <div class="setting-row"><div><h3>精简战斗日志</h3><p>仅显示最近 4 条记录，关闭则显示最近 12 条</p></div><button class="switch ${settings.shortLogs?'on':''}" data-action="setting-log" aria-label="切换精简战斗日志"><span></span></button></div>
 <div class="setting-row"><div><h3>音效音量</h3><p>调整战斗、治疗和菜单音效（0 = 静音）</p></div><label class="volume-control"><input id="volume-control" type="range" min="0" max="100" step="5" value="${settings.volume}" aria-label="音效音量"/><output id="volume-value" for="volume-control">${settings.volume}%</output></label></div>
 <div class="setting-row"><div><h3>战斗表现节奏</h3><p>控制技能字样、伤害数字及打击动效速度，不改变回合规则</p></div><div class="pace-options" role="group" aria-label="战斗表现节奏">${[['slow','沉浸'],['normal','标准'],['fast','快速']].map(([value,title])=>`<button type="button" data-action="pace" data-id="${value}" class="btn btn-tiny ${settings.pace===value?'btn-gold':'btn-ghost'}" aria-pressed="${settings.pace===value}">${title}</button>`).join('')}</div></div>
 <div class="setting-row"><div><h3>显示模式</h3><p>切换浏览器全屏（可能需要许可）</p></div>${button('切换全屏','fullscreen','','btn btn-ghost')}</div><div class="ornamental-line"></div><p class="small-muted">版本 V1.0 · 纯 Web · IndexedDB 本地存档 · 原创游戏与 SVG 场景 · 支持离线运行。</p></div></section>`;}
function footer(){return `<footer class="site-footer"><span>ASHEN VOW © ORIGINAL BROWSER PROTOTYPE</span><span><span class="save-light"></span><span id="save-text">${saveStatus}</span> · 存档 ${slot} / 3</span></footer><div class="toast" id="toast" role="status"></div><input type="file" id="import-file" accept="application/json,.json" hidden/>`}
function render(){clearFx();if(game&&settings.sound&&settings.music&&!bgmNodes)startBgm();root.innerHTML=`<div class="app-frame ${reducedMotion()?'low-motion':''} ${settings.largeText?'large-text':''} pace-${settings.pace}"><div class="grain"></div>${hud()}<main class="main">${view==='menu'?homePage():view==='saves'?savesPage():view==='settings'?settingsPage():view==='guide'?guidePage():view==='codex'?codexPage():!game?homePage():game.phase==='camp'?campPage():game.phase==='map'?mapPage():game.phase==='battle'?battlePage():game.phase==='event'?eventPage():resultPage()}</main>${footer()}</div>`;
 const f=document.getElementById('import-file');if(f)f.addEventListener('change',handleImport);
}
async function handleImport(e){const file=e.target.files?.[0];if(!file)return;try{const data=await readSaveFile(file,isValidSave);if(!window.confirm(`确定把导入的存档写入存档槽 ${importTarget} 吗？该槽位旧数据会被覆盖。`))return;await saveQueue.catch(()=>{});await storeSlot(importTarget,data);await reloadSlots();if(game&&slot===importTarget){game=ensureProgression(data);view='game';chosenSkill=null}else{view='saves'}render();announce('存档导入成功');}catch(err){announce(`导入失败：${err.message}`,true)}finally{e.target.value='';}}
async function actionRun(el){const a=el.dataset.action, id=el.dataset.id, n=Number(el.dataset.slot);
 if(a==='nav-menu'){uiNavigate('menu');return;}if(a==='nav-game'){if(game)uiNavigate('game');return;}
 if(a==='nav-saves'){await reloadSlots();uiNavigate('saves');return;}if(a==='nav-settings'){uiNavigate('settings');return;}if(a==='nav-guide'){uiNavigate('guide');return;}if(a==='nav-codex'){uiNavigate('codex');return;}if(a==='codex-tab'){if(['heroes','skills','monsters','regions','equipment'].includes(id))codexTab=id;render();return;}
 if(a==='tutorial-done'){if(game&&!game.tutorialSeen){game.tutorialSeen=true;playSave();}uiNavigate(game?'game':'menu');return;}
 if(a==='new'){await startNew(n);return;}if(a==='load'){await load(n);return;}
 if(a==='delete'){if(!window.confirm(`确定彻底删除存档 ${n} 吗？此操作不可撤销，请先导出备份。`))return;await saveQueue.catch(()=>{});await deleteSlot(n);if(game&&slot===n){game=null;view='saves';saveStatus='存档已删除'}await reloadSlots();render();announce('存档已删除');return;}
 if(a==='export'){try{await saveQueue.catch(()=>{});const data=await getSlot(n);if(!data)throw Error('存档不存在');downloadSave(data,n);announce('已生成 JSON 存档备份');}catch(err){announce(err.message,true)}return;}
 if(a==='import'){importTarget=n;document.getElementById('import-file')?.click();return;}
 if(a==='restore'){const age=Number(el.dataset.age);if(!window.confirm(`恢复存档 ${n} 的第 ${age} 份备份吗？当前存档将被覆盖（完整的当前存档会尝试保留到备份历史）。`))return;await saveQueue.catch(()=>{});try{await restoreBackup(n,age,isValidSave);await reloadSlots();if(slot===n){game=ensureProgression(await getSlot(n));view='game';}render();announce('历史存档恢复成功');}catch(e){announce(`恢复失败：${e.message}`,true)}return;}
 if(a==='setting-sound'){settings.sound=!settings.sound;preferences.setItem('av-sound',settings.sound?'on':'off');render();if(settings.sound)sound();return;}
 if(a==='setting-music'){settings.music=!settings.music;preferences.setItem('av-music',settings.music?'on':'off');syncBgm();render();return;}
 if(a==='setting-motion'){settings.lowMotion=!settings.lowMotion;preferences.setItem('av-motion',settings.lowMotion?'low':'normal');render();return;}
 if(a==='setting-text'){settings.largeText=!settings.largeText;preferences.setItem('av-large-text',settings.largeText?'on':'off');render();return;}
 if(a==='setting-log'){settings.shortLogs=!settings.shortLogs;preferences.setItem('av-short-logs',settings.shortLogs?'on':'off');render();return;}
 if(a==='pace'){if(!['slow','normal','fast'].includes(id))return;settings.pace=id;preferences.setItem('av-pace',id);render();return;}
 if(a==='fullscreen'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>announce('无法开启全屏模式',true));else document.exitFullscreen?.();return;}
 if(!game)return;
 if(a==='building'){if(mutate(()=>upgradeBuilding(game,id))!==undefined)sound('heal');return;}
 if(a==='plan'){mutate(()=>selectExpeditionPlan(game,id));sound('tap');return;}
 if(a==='region'){mutate(()=>selectRegion(game,id));sound('event');return;}
 if(a==='difficulty'){mutate(()=>selectDifficulty(game,id));sound('tap');return;}
 if(a==='train-skill'){const ok=mutate(()=>trainSkill(game,id,el.dataset.kind));if(ok!==false)sound('heal');return;}
 if(a==='skill-branch'){const ok=mutate(()=>chooseSkillBranch(game,id,el.dataset.kind,el.dataset.branch));if(ok!==false)sound('heal');return;}
 if(a==='treat-trait'){const ok=mutate(()=>treatNegativeTrait(game,id,el.dataset.kind));if(ok!==false)sound('heal');return;}
 if(a==='pray'){mutate(()=>prayAtCamp(game,id));sound('heal');return;}
 if(a==='talent-hero'){chosenEquipHero=id;render();return;}
 if(a==='talent'){mutate(()=>allocateTalent(game,id,el.dataset.kind));sound('heal');return;}
 if(a==='camp-tab'){campTab=id;render();return;}
 if(a==='camp-section'){campSection=id;const t=el.dataset.tab;if(t)campTab=t;else campTab=campSection==='archive'?'journal':'team';render();return;}
 if(a==='quick-heal'){if(id){const ok=mutate(()=>healAtCamp(game,id));if(ok!==false)sound('heal');}return;}
 if(a==='hero-focus'){campSection='heroes';campTab='team';chosenActiveHero=id;chosenEquipHero=id;render();return;}
 if(a==='active-choice'){chosenActiveHero=id;render();return;}
 if(a==='equip-hero'){chosenEquipHero=id;render();return;}
 if(a==='recruit'){mutate(()=>hireRecruit(game,Number(el.dataset.index)));sound('heal');return;}
 if(a==='swap-hero'){mutate(()=>swapHero(game,el.dataset.active,id));chosenActiveHero=null;sound();return;}
 if(a==='dismiss'){if(window.confirm('确定遣散该后备英雄吗？已装备饰品会回到仓库。'))mutate(()=>dismissReserve(game,id));return;}
 if(a==='equip'){mutate(()=>equipTrinket(game,el.dataset.hero,id,Number(el.dataset.slot)));sound('heal');return;}
 if(a==='unequip'){mutate(()=>unequipTrinket(game,id,Number(el.dataset.slot)));sound();return;}
 if(a==='salvage'){if(window.confirm('确定分解这件饰品换取遗物碎片吗？'))mutate(()=>salvageTrinket(game,id));return;}
 if(a==='heal'){mutate(()=>healAtCamp(game,id));sound();return;}
 if(a==='upgrade'){mutate(()=>upgradeHero(game,id));sound();return;}
 if(a==='forge'){mutate(()=>forgeGear(game,id,el.dataset.kind));sound('heal');return;}
 if(a==='move'){mutate(()=>moveHero(game,id,Number(el.dataset.direction)));sound('tap');return;}
 if(a==='buy'){mutate(()=>buySupplies(game,el.dataset.type));sound();return;}
 if(a==='expedition'){mutate(()=>beginExpedition(game));sound();return;}
 if(a==='node'){mapSelectedNode=id;sound();render();return;}
 if(a==='enter-node'){mapSelectedNode=null;const result=mutate(()=>enterNode(game,id));if(result!==false)sound(game?.phase==='battle'?'hit':'event');return;}
 if(a==='use-potion'){mutate(()=>usePotion(game,id));sound('heal');return;}
 if(a==='use-sigil'){mutate(()=>useSigil(game,id));sound('heal');return;}
 if(a==='choice'){mutate(()=>resolveEvent(game,id));sound();return;}
 if(a==='retreat'){if(window.confirm('现在撤退吗？已获得的战利品可以带回营地。'))mutate(()=>retreat(game));return;}
 if(a==='camp'){mutate(()=>backToCamp(game));return;}
 if(a==='skip'){const result=commitBattleAction(()=>skipTurn(game));if(result!==false)sound('tap');return;}
 if(a==='end-turn'){const result=commitBattleAction(()=>endTurn(game));if(result!==false)sound('tap');return;}
 if(a==='basic-attack'){
  const actor=currentActor(game);if(!actor||actor.side!=='hero'){announce('尚未轮到英雄行动',true);return;}
  chosenSkill=chosenSkill==='__basic__'?null:'__basic__';inspectUnitId=null;sound();render();return;
 }
 if(a==='skill'){
  const actor=currentActor(game),s=SKILLS[id];if(!actor||actor.side!=='hero'||!s.caster.includes(actor.rank)){announce('当前站位不可使用该技能',true);return;}
  chosenSkill=chosenSkill===id?null:id;inspectUnitId=null;sound();if(chosenSkill&&s.side==='self'){commitBattleAction(()=>performSkill(game,id,actor.id),id);}else render();return;
 }
 if(a==='unit'){
  const actor=currentActor(game),sk=SKILLS[chosenSkill];
  if(game.phase==='battle'&&chosenSkill==='__basic__'&&actor?.side==='hero'){
   if(game.battle.enemies.some(u=>u.id===id&&u.hp>0)){
    const ret=commitBattleAction(()=>basicAttack(game,id),'__basic__');
    if(ret?.ok===false)announce(ret.error,true);else chosenSkill=null;
   }else announce('请选择敌方目标',true);
   return;
  }
  if(game.phase==='battle'&&chosenSkill&&actor?.side==='hero'&&sk){
   if(validTargets(game.battle,actor,sk).some(u=>u.id===id)){
    const ret=commitBattleAction(()=>performSkill(game,chosenSkill,id),chosenSkill);
    if(ret?.ok===false)announce(ret.error,true);
    inspectUnitId=id;return;
   }
   announce('此目标不在技能的可选范围内',true);
  }
  inspectUnitId=inspectUnitId===id?null:id;render();return;
 }
 if(a==='bandage'){mutate(()=>useBandage(game,id));return;}
}
root.addEventListener('input',e=>{if(e.target?.id==='volume-control'){settings.volume=clamp(Number(e.target.value)||0,0,100);preferences.setItem('av-volume',String(settings.volume));const output=document.getElementById('volume-value');if(output)output.textContent=`${settings.volume}%`;}});
root.addEventListener('change',e=>{if(e.target?.id==='volume-control'){sound('tap');if(bgmNodes&&audioContext){const vol=(settings.volume/100)*0.22;bgmNodes.master.gain.linearRampToValueAtTime(Math.max(0.0001,vol),audioContext.currentTime+0.3);}}});
root.addEventListener('click',e=>{const control=e.target.closest('[data-action]');if(!control||control.disabled||waiting)return;waiting=true;Promise.resolve(actionRun(control)).catch(err=>{console.error(err);announce(err.message||'操作失败',true)}).finally(()=>waiting=false);});
window.addEventListener('keydown',e=>{if(view!=='game'||game?.phase!=='battle'||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Escape'){chosenSkill=null;render();return;}if(['1','2','3'].includes(e.key)){const hero=currentActor(game);if(hero?.side==='hero'){const skill=CLASSES[hero.classId].skills[Number(e.key)-1];actionRun({dataset:{action:'skill',id:skill}});}}});
(async()=>{try{await reloadSlots();const first=cachedSlots.filter(x=>snapshotValid(x)&&isValidSave(x.data)).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt))[0];if(first){slot=first.slot;game=ensureProgression(first.data);saveStatus='本地存档就绪';}}catch(e){saveStatus='存档不可用';console.error(e);}render();})();

</script></body></html>
