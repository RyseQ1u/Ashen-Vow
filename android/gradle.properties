# Gradle / Android 构建参数
# 仓库路径含中文，必须显式让 JVM 以 UTF-8 处理文件名，否则 Windows 上会出现
# ManifestMerger「Error parsing ... íøÒ³ÓÅ»¯ ...」的乱码路径报错。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 本工程完全使用 Android 框架自带 API（WebView / Activity），不依赖 AndroidX
android.useAndroidX=false
android.nonTransitiveRClass=true

# 仓库路径包含中文（网页优化），AGP 默认会拒绝构建；此开关跳过该检查。
# 若在纯 ASCII 路径下构建，可删除本行。
android.overridePathCheck=true
